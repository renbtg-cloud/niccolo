name: Export current Niccolo checkout for offline Linux VM
on:
  push:
    branches: [ci/vm-source-refresh-20261114]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Archive tracked source without any untracked local secrets
        run: |
          set -euo pipefail
          git archive --format=tar --prefix=niccolo/ HEAD | gzip -9 > "$RUNNER_TEMP/niccolo-source.tar.gz"
          sha256sum "$RUNNER_TEMP/niccolo-source.tar.gz" > "$RUNNER_TEMP/source-sha256.txt"
          git rev-parse HEAD > "$RUNNER_TEMP/source-commit.txt"
          tar -tzf "$RUNNER_TEMP/niccolo-source.tar.gz" | head -25 || true
      - uses: actions/upload-artifact@v4
        with:
          name: niccolo-current-vm-source
          path: |
            ${{ runner.temp }}/niccolo-source.tar.gz
            ${{ runner.temp }}/source-sha256.txt
            ${{ runner.temp }}/source-commit.txt
          retention-days: 2
          if-no-files-found: error
