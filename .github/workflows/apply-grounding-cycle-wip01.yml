name: Apply grounding-cycle WIP 01

on:
  push:
    branches: [tmp/apply-grounding-cycle-wip01-20261121]
    paths: [.github/workflows/apply-grounding-cycle-wip01.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Verify expected head
        run: test "$(git rev-parse HEAD)" = "413eb1d48532fe72afc75b134d61195639c6b907"
      - name: Apply patch
        shell: bash
        run: |
          cat > /tmp/patch.b64 <<'EOF'

EOF
          base64 -d /tmp/patch.b64 | gunzip > /tmp/change.patch
          git apply /tmp/change.patch
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/epistemic_workbench.rs frontend/src/pages/ExpertWorkbenchPage.jsx frontend/src/pages/ExpertWorkbench.product.test.js
          git commit -m "WIP 01: grounding cycle diagnostics"
          git push origin HEAD:main
