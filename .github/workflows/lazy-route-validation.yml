name: Validate lazy technical routes
on:
  push:
    branches:
      - feat/lazy-technical-routes-20261114
    paths:
      - 'src/api.rs'
      - 'frontend/src/App.jsx'
      - 'frontend/dist/**'
      - 'scripts/build-mvp.sh'
      - 'scripts/test-build-mvp-mode.sh'
      - '.github/workflows/lazy-route-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lazy-routes:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Run frontend regressions
        run: npm test
        working-directory: frontend
      - name: Build split assets
        run: npm run build
        working-directory: frontend
      - name: Verify dependency-mode and lazy-chunk build contracts
        run: bash scripts/test-build-mvp-mode.sh
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt
          rustup default 1.99.1
      - name: Formatting
        run: rustfmt --edition 2024 --check src/api.rs
      - name: Check embedded chunk HTTP routes
        run: cargo test --locked --lib embedded_technical_chunks -- --nocapture
