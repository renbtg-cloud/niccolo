name: Apply expert workbench patch once

on:
  push:
    branches:
      - tmp/apply-expert-workbench-20261120
    paths:
      - .github/workflows/apply-expert-workbench-once.yml
      - .tmp/expert_code.patch.gz

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/apply-expert-workbench-20261120
          fetch-depth: 0
      - name: Preserve patch
        run: cp .tmp/expert_code.patch.gz /tmp/expert_code.patch.gz
      - name: Apply patch to clean main and publish feature branch
        run: |
          git checkout main
          git checkout -B tmp/expert-workbench-code-20261120
          gzip -dc /tmp/expert_code.patch.gz | patch -p1
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sql/0100_expert_epistemic_workbench.sql src/epistemic_workbench.rs src/lib.rs src/api.rs tests/epistemic_workbench_integration.rs frontend/src/state/expertWorkbench.js frontend/src/pages/ExpertWorkbenchPage.jsx frontend/src/pages/ExpertWorkbench.product.test.js frontend/src/api/client.js frontend/src/App.jsx frontend/src/styles.css
          git diff --cached --check
          git commit -m "feat(epistemic): add expert authoring workbench"
          git push --force-with-lease origin HEAD:tmp/expert-workbench-code-20261120
