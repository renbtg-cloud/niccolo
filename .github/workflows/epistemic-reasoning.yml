name: Epistemic reasoning checks
on:
  push:
    branches:
      - feature/epistemic-weights-v1
  pull_request:
    paths:
      - "src/**"
      - "sql/**"
      - "tests/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/epistemic-reasoning.yml"

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt,clippy
          rustup default 1.99.1
      - name: Formatting
        run: rustfmt --edition 2024 --check src/api.rs src/epistemic_weights.rs src/human_credence.rs src/reasoning_packet.rs tests/human_credence_integration.rs
      - name: Unit tests
        run: cargo test --locked --lib
      - name: Strict Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
