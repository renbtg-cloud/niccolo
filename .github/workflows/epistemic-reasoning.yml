name: Epistemic reasoning checks
# Normal commits to main never trigger CI. An operator can dispatch manually,
# or explicitly move ci/mvp-checkpoint to the desired tested commit.
on:
  workflow_dispatch:
  push:
    branches:
      - ci/mvp-checkpoint

concurrency:
  group: epistemic-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt,clippy
          rustup default 1.99.1
      - name: Formatting
        run: rustfmt --edition 2024 --check src/api.rs src/source_import.rs src/adversarial_dossier.rs src/postgres_ingest.rs src/purpose_history.rs src/analysis_snapshot.rs src/epistemic_weights.rs src/human_credence.rs src/epistemic_policy_store.rs src/reasoning_packet.rs src/grounded_claim_weights.rs src/grounded_lineage_store.rs src/provenance_clusters.rs src/presentation_package.rs src/checkpoint_package.rs src/operation_checkpoint.rs src/operation_budget.rs src/runtime_resources.rs src/resource_policy.rs src/resource_diagnostics.rs src/bff_operations.rs src/bff_executor.rs src/bff_intent.rs src/git_publication.rs src/intake_git_publication.rs src/github_publisher.rs src/integration_diagnostics.rs src/upstream_processing.rs src/local_handoff.rs tests/source_ingestion_integration.rs tests/bff_operations_integration.rs tests/bff_http_integration.rs tests/human_credence_integration.rs tests/grounded_claim_weights_integration.rs tests/git_publication_integration.rs tests/integration_boundary_paranoid.rs
      - name: Verify Markdown navigation and root layout
        run: |
          python3 -m unittest discover -s tests -p "test_check_doc_links.py" -v
          python3 -m unittest discover -s tests -p "test_law_firm_mvp_acceptance.py" -v
          python3 -m unittest discover -s tests -p "test_law_firm_fixture_inventory.py" -v
          python3 -m unittest discover -s tests -p "test_prepare_law_firm_fixture.py" -v
          python3 -m unittest discover -s tests -p "test_run_law_firm_canonical_demo.py" -v
          python3 scripts/check-law-firm-mvp-acceptance.py fixtures/law-firm-mvp/acceptance.example.json
          python3 scripts/check-law-firm-mvp-acceptance.py --require-complete fixtures/law-firm-mvp/acceptance.completed.json
          python3 scripts/check-doc-links.py
      - name: Validate local MVP shell syntax before compiling
        run: |
          set -euo pipefail
          for script in scripts/bootstrap-local-mvp.sh scripts/test-bootstrap-prereqs.sh scripts/build-mvp.sh scripts/test-build-mvp-mode.sh scripts/first-run-local-mvp.sh scripts/test-first-run-local-mvp.sh scripts/start-local-mvp.sh scripts/test-start-local-handoff.sh scripts/open-local-mvp-browser.sh scripts/configure-local-model.sh scripts/test-configure-local-model.sh scripts/smoke-local-first-run.sh; do
            bash -n "$script"
          done
      - name: Test online/offline MVP build dependency mode
        run: bash scripts/test-build-mvp-mode.sh
      - name: Test bootstrap prerequisite preflight
        run: bash scripts/test-bootstrap-prereqs.sh
      - name: Test private local-model configuration boundaries
        run: bash scripts/test-configure-local-model.sh
      - name: Test one-command first-run wrapper boundaries
        run: bash scripts/test-first-run-local-mvp.sh
      - name: Test one-shot local browser handoff boundary
        run: bash scripts/test-start-local-handoff.sh
      - name: Standalone Python export template tests
        run: python3 -m unittest discover -s tests -p "test_presentation_inspector.py" -v
      - name: Unit tests
        run: cargo test --locked --lib
      - name: Strict Clippy
        run: cargo clippy --locked --all-targets -- -D warnings


  windows-native:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          rustup default 1.99.1
      - name: Check Windows library build
        run: cargo check --locked --lib
      - name: Test native resource observer contracts
        run: cargo test --locked --lib runtime_resources::tests -- --nocapture

  database:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: niccolo
          POSTGRES_PASSWORD: ephemeral_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d niccolo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      NICCOLO_PG_ADMIN_URL: postgres://postgres:ephemeral_ci_password@localhost:5432/niccolo
      NICCOLO_PG_SECURE_URL: postgres://niccolo_secure:ephemeral_ci_password@localhost:5432/niccolo
      NICCOLO_PG_SERVICE_URL: postgres://niccolo_service:ephemeral_ci_password@localhost:5432/niccolo
      NICCOLO_NEXT_ADMIN_URL: postgres://postgres:ephemeral_ci_password@localhost:5432/niccolo
      NICCOLO_NEXT_APP_URL: postgres://niccolo_service:ephemeral_ci_password@localhost:5432/niccolo
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          rustup default 1.99.1
      - name: Apply every SQL migration from scratch
        run: |
          set -euo pipefail
          for migration in sql/[0-9][0-9][0-9][0-9]_*.sql; do
            psql -X -v ON_ERROR_STOP=1 "$NICCOLO_PG_ADMIN_URL" -f "$migration" >/dev/null
          done
          psql -X -v ON_ERROR_STOP=1 "$NICCOLO_PG_ADMIN_URL" <<'SQL'
          CREATE ROLE niccolo_secure LOGIN PASSWORD 'ephemeral_ci_password';
          GRANT niccolo_api TO niccolo_secure WITH INHERIT TRUE, SET FALSE;
          CREATE ROLE niccolo_service LOGIN PASSWORD 'ephemeral_ci_password';
          GRANT niccolo_app TO niccolo_service WITH INHERIT TRUE, SET FALSE;
          SQL
      - name: Run authenticated PostgreSQL endpoint integration
        run: cargo test --locked --features pg-integration --test human_credence_integration -- --nocapture
      - name: Run source-grounded claim scoring integration
        run: cargo test --locked --features pg-integration --test grounded_claim_weights_integration -- --nocapture
      - name: Run full PostgreSQL integration regression with bounded concurrency
        run: cargo test --locked --features pg-integration --tests -- --test-threads=2
      - name: Run canonical Aurelius & Finch demonstration
        run: |
          rm -rf artifacts/law-firm-canonical
          python3 scripts/run-law-firm-canonical-demo.py \
            --output artifacts/law-firm-canonical \
            --verify-rust
      - name: Upload canonical law-firm artifact
        uses: actions/upload-artifact@v4
        with:
          name: aurelius-finch-canonical-${{ github.sha }}
          path: artifacts/law-firm-canonical
          if-no-files-found: error


  frontend:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run frontend tests
        working-directory: frontend
        run: npm test
      - name: Build frontend
        working-directory: frontend
        run: npm run build

  first-run:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 55
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: niccolo
          POSTGRES_PASSWORD: ephemeral_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d niccolo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      NICCOLO_PG_ADMIN_URL: postgres://niccolo_bootstrap_admin:ephemeral_ci_admin_password@localhost:5432/niccolo_first_run
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@v4
      - name: Prepare non-superuser first-run database owner
        env:
          PGPASSWORD: ephemeral_ci_password
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -U postgres -h localhost -d postgres <<'SQL'
          CREATE ROLE niccolo_bootstrap_admin LOGIN CREATEROLE CREATEDB PASSWORD 'ephemeral_ci_admin_password';
          CREATE DATABASE niccolo_first_run OWNER niccolo_bootstrap_admin;
          SQL
          test "$(psql -X -At "$NICCOLO_PG_ADMIN_URL" -c "SELECT rolsuper FROM pg_roles WHERE rolname=current_user")" = f
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          rustup default 1.99.1
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Check every MVP setup shell script
        run: |
          set -euo pipefail
          for script in scripts/smoke-local-first-run.sh scripts/bootstrap-local-mvp.sh scripts/build-mvp.sh scripts/start-local-mvp.sh scripts/open-local-mvp-browser.sh scripts/configure-local-model.sh; do
            bash -n "$script"
          done
          node --check scripts/ci-openai-compatible-mock.mjs
      - name: Fail early when bootstrap owner cannot create the runtime login
        env:
          PGPASSWORD: ephemeral_ci_password
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -U postgres -h localhost -d postgres <<'SQL'
          CREATE ROLE niccolo_no_createrole LOGIN NOSUPERUSER NOCREATEROLE NOBYPASSRLS PASSWORD 'ephemeral_no_createrole_password';
          CREATE DATABASE niccolo_no_createrole OWNER niccolo_no_createrole;
          SQL
          log="$(mktemp)"
          trap 'rm -f "$log"' EXIT
          if NICCOLO_PG_ADMIN_URL='postgres://niccolo_no_createrole:ephemeral_no_createrole_password@localhost:5432/niccolo_no_createrole' \
             NICCOLO_PG_SECURE_PASSWORD='unused_runtime_password' \
             bash scripts/bootstrap-local-mvp.sh >"$log" 2>&1; then
            echo 'Bootstrap unexpectedly accepted a database owner without CREATEROLE' >&2
            exit 1
          fi
          grep -Fq 'must have CREATEROLE' "$log"
          ! grep -Fq '[1/4] Build MVP' "$log"
          psql -X -v ON_ERROR_STOP=1 -U postgres -h localhost -d postgres <<'SQL'
          DROP DATABASE niccolo_no_createrole;
          DROP ROLE niccolo_no_createrole;
          SQL
      - name: Fresh MVP bootstrap, authenticated first Situation, and Analyze wiring
        run: |
          set -euo pipefail
          node scripts/ci-openai-compatible-mock.mjs > /tmp/niccolo-ci-model.log 2>&1 &
          model_pid=$!
          cleanup_model(){ kill "$model_pid" 2>/dev/null || true; wait "$model_pid" 2>/dev/null || true; }
          trap cleanup_model EXIT
          for _ in $(seq 1 40); do
            if curl --max-time 2 --silent --fail http://127.0.0.1:18080/healthz >/dev/null; then break; fi
            if ! kill -0 "$model_pid" 2>/dev/null; then
              cat /tmp/niccolo-ci-model.log >&2
              exit 1
            fi
            sleep .25
          done
          export NICCOLO_LLM_BASE_URL='http://127.0.0.1:18080/v1'
          export NICCOLO_LLM_MODEL='niccolo-ci-protocol-smoke'
          export NICCOLO_LLM_PROVIDER='ci-protocol-smoke'
          bash scripts/smoke-local-first-run.sh
