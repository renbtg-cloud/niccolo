name: tmp live export

on:
  push:
    branches: [tmp-live-export]
    paths:
      - '.export/ready'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare source snapshot
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .git .export .github/workflows/tmp-live-export.yml
          tar -czf /tmp/niccolo-main-v024.tar.gz .
          sha256sum /tmp/niccolo-main-v024.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: niccolo-main-v024
          path: /tmp/niccolo-main-v024.tar.gz
          if-no-files-found: error
