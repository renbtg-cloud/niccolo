name: Apply reassessment review WIP 01

on:
  push:
    branches:
      - 'tmp/apply-reassessment-review-wip01-20261121'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Verify expected head
        run: |
          test "$(git rev-parse HEAD)" = "fd67bad8f0583a3f3b5161b5bd7a1ffe71799582"
      - name: Apply patch
        run: |
          cat > /tmp/patch.b64 <<'EOF'
          
          EOF
          sed -i 's/^          //' /tmp/patch.b64
          base64 -d /tmp/patch.b64 | gunzip > /tmp/change.patch
          git apply /tmp/change.patch
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sql/0102_epistemic_reassessment_reviews.sql src/epistemic_workbench.rs
          git commit -m "WIP 01: reassessment review workflow"
          git push origin HEAD:main
