name: Push archived local devrepo commit b9f00e6
on:
  push:
    branches: [tmp/local-devrepo-push-20261112]
permissions:
  contents: write
jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply b9f00e6 and push immediately
        shell: bash
        run: |
          set -euo pipefail
          base64 -d dev-flow/patches/local-devrepo-b9f00e6.mbox.gz.b64 | gzip -d > /tmp/b9.mbox
          git fetch origin archive/niccolo-devrepo-20261112
          git checkout -B archive-work FETCH_HEAD
          test "$(git rev-parse HEAD^{tree})" = 2ada52a64c42a614157d210995307d3bdaf4be4a
          git config user.name "ChatGPT autonomous worker"
          git config user.email "chatgpt-local@invalid"
          git am /tmp/b9.mbox
          test "$(git rev-parse HEAD^{tree})" = 0be3449c3780af515ed4b9341f21b77f52c05157
          git push origin HEAD:refs/heads/archive/niccolo-devrepo-20261112
