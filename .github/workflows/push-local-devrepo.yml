name: Push archived local devrepo commit 1d20c20
on:
  push:
    branches: [tmp/local-devrepo-push-20261112]
permissions:
  contents: write
jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply non-workflow 1d20c20 and push immediately
        shell: bash
        run: |
          set -euo pipefail
          base64 -d dev-flow/patches/local-devrepo-1d20c20.mbox.gz.b64 | gzip -d > /tmp/1d.mbox
          git fetch origin archive/niccolo-devrepo-20261112
          git checkout -B archive-work FETCH_HEAD
          git config user.name "ChatGPT autonomous worker"
          git config user.email "chatgpt-local@invalid"
          git apply --exclude=.github/workflows/epistemic-reasoning.yml /tmp/1d.mbox
          git add -A
          test "$(git write-tree)" = f55d0a96662e931b5745468d606c0d529ce6317c
          git commit -m "mvp: add one-command first-user setup orchestration"
          git push origin HEAD:refs/heads/archive/niccolo-devrepo-20261112
