name: Push archived local devrepo commit 2d9d900
on:
  push:
    branches: [tmp/local-devrepo-push-20261112]
permissions:
  contents: write
jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply non-workflow portion and push immediately
        shell: bash
        run: |
          set -euo pipefail
          base64 -d dev-flow/patches/local-devrepo-2d9d900.mbox.gz.b64 | gzip -d > /tmp/2d9.mbox
          git fetch origin archive/niccolo-devrepo-20261112
          git checkout -B archive-work FETCH_HEAD
          git config user.name "ChatGPT autonomous worker"
          git config user.email "chatgpt-local@invalid"
          git apply --exclude=.github/workflows/epistemic-reasoning.yml /tmp/2d9.mbox
          git add -A
          test "$(git write-tree)" = 2ada52a64c42a614157d210995307d3bdaf4be4a
          git commit -m "mvp: harden first-user offline flow and preserve anytime checkpoint packages"
          git push origin HEAD:refs/heads/archive/niccolo-devrepo-20261112
