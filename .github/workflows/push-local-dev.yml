name: Push archived niccolo-dev 76c4dca
on:
  push:
    branches: [tmp/local-dev-push-20261112]
permissions:
  contents: write
jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply non-workflow 76c4dca and push immediately
        shell: bash
        run: |
          set -euo pipefail
          base64 -d dev-flow/patches/local-dev-76c4dca.mbox.gz.b64 | gzip -d > /tmp/76c.mbox
          git fetch origin archive/niccolo-dev-20261112
          git checkout -B archive-work FETCH_HEAD
          git config user.name "ChatGPT autonomous worker"
          git config user.email "chatgpt-local@invalid"
          git apply --exclude=.github/workflows/epistemic-reasoning.yml /tmp/76c.mbox
          git add -A
          test "$(git write-tree)" = 54d5face288f9a641d45783b79aa26b23e5c8293
          git commit -m "Reduce first local run to one guarded command"
          git push origin HEAD:refs/heads/archive/niccolo-dev-20261112
