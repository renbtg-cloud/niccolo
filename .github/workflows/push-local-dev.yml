    branches: [tmp/local-dev-push-20261112]
permissions:
  contents: write
jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply 0dad9cd and push immediately
        shell: bash
        run: |
          set -euo pipefail
          base64 -d dev-flow/patches/local-dev-0dad9cd.mbox.gz.b64 | gzip -d > /tmp/0dad.mbox
          git fetch origin archive/niccolo-dev-20261112
