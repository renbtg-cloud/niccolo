name: Push archived niccolo-dev ed8cb93
on:
  push:
    branches: [tmp/local-dev-push-20261112]
permissions:
  contents: write
jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply ed8cb93 and push immediately
        shell: bash
        run: |
          set -euo pipefail
          base64 -d dev-flow/patches/local-dev-ed8cb93.mbox.gz.b64 | gzip -d > /tmp/ed8.mbox
          git fetch origin archive/niccolo-dev-20261112
          git checkout -B archive-work FETCH_HEAD
          test "$(git rev-parse HEAD^{tree})" = 1a3972a41e556eeb6d129ffed037760fc7d8ad89
          git config user.name "ChatGPT autonomous worker"
          git config user.email "chatgpt-local@invalid"
          git am /tmp/ed8.mbox
          test "$(git rev-parse HEAD^{tree})" = 7fedb914957a91a633dd0b23072872ce900f2615
          git push origin HEAD:refs/heads/archive/niccolo-dev-20261112
