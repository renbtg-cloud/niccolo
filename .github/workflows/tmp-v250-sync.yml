name: tmp v250 sync

on:
  push:
    branches: [tmp-v250-sync]
    paths:
      - '.sync/v250.ready'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply VM-validated v0.250 patch
        shell: bash
        run: |
          set -euo pipefail
          cat .sync/v250.xz00 .sync/v250.xz01 .sync/v250.xz02 .sync/v250.xz03 .sync/v250.xz04 .sync/v250.xz05 .sync/v250.xz06 .sync/v250.xz07 .sync/v250.xz08 .sync/v250.xz09 .sync/v250.xz10 .sync/v250.xz11 .sync/v250.xz12 .sync/v250.xz13 .sync/v250.xz14 | base64 -d > /tmp/v250.patch.xz
          echo "f60d0c38689ae0f4aa42c60418be4bf9ec9e7963c331770ee99bbd1e9964d3fb  /tmp/v250.patch.xz" | sha256sum -c -
          xz -dc /tmp/v250.patch.xz > /tmp/v250.patch
          echo "f47a2ca9f3b7d90cb8babfc69fa3afef324a580796bba868f7c0bdb325983b8a  /tmp/v250.patch" | sha256sum -c -
          git apply --check /tmp/v250.patch
          git apply /tmp/v250.patch
          rm -rf .sync .github/workflows/tmp-v250-sync.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: add human-owned reasoning, durable BFF and React V1 substrate [skip ci]"
          git push origin HEAD:tmp-v250-sync
