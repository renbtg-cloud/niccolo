name: tmp v250 sync

on:
  push:
    branches: [tmp-v250-sync]
    paths:
      - '.sync/v250.ready'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply VM-validated v0.250 patch
        shell: bash
        run: |
          set -euo pipefail
          cat .sync/v250.patch00 .sync/v250.patch01 .sync/v250.patch02 .sync/v250.patch03 .sync/v250.patch04 .sync/v250.patch05 .sync/v250.patch06 .sync/v250.patch07 .sync/v250.patch08 .sync/v250.patch09 .sync/v250.patch10 .sync/v250.patch11 .sync/v250.patch12 .sync/v250.patch13 .sync/v250.patch14 .sync/v250.patch15 .sync/v250.patch16 .sync/v250.patch17 | base64 -d > /tmp/v250.patch.gz
          echo "0b4dd3cd339ef284146f4881a6b085e1e39dfbb567e69a5b79ad812278d3c444  /tmp/v250.patch.gz" | sha256sum -c -
          gunzip -c /tmp/v250.patch.gz > /tmp/v250.patch
          echo "f47a2ca9f3b7d90cb8babfc69fa3afef324a580796bba868f7c0bdb325983b8a  /tmp/v250.patch" | sha256sum -c -
          git apply --check /tmp/v250.patch
          git apply /tmp/v250.patch
          rm -rf .sync .github/workflows/tmp-v250-sync.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: add human-owned reasoning, durable BFF and React V1 substrate [skip ci]"
          git push origin HEAD:tmp-v250-sync
