name: Apply reasoning diagnostics WIP 01

on:
  push:
    branches:
      - 'tmp/apply-reasoning-diagnostics-wip01-20261121'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Verify expected head
        run: test "$(git rev-parse HEAD)" = "b33790dd3e32b6a66b887166303dc699105d847a"
      - name: Apply patch
        run: |
          echo '' | base64 -d | gunzip > /tmp/change.patch
          git apply /tmp/change.patch
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/epistemic_workbench.rs
          git commit -m "WIP 01: explicit reasoning diagnostics"
          git push origin HEAD:main
