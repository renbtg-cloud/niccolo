name: sync WIP4 v430
on:
  push:
    branches: [tmp-wip430-sync]
    paths: ['.sync/wip430.ready']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git apply --check .sync/wip430.patch
          git apply .sync/wip430.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/bff_http_integration.rs
          git commit -m "WIP 4: human-intent BFF launch flow v0.391-v0.430"
          git push origin HEAD:main
