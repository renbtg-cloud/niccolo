name: Apply grounding cycle WIP 02

on:
  push:
    branches:
      - 'tmp/apply-grounding-cycle-wip02-20261121'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Verify expected head
        run: |
          test "$(git rev-parse HEAD)" = "27d21fd3460c3b6cde975765cfbc794b35b1e33a"
      - name: Apply patch
        run: |
          cat > /tmp/patch.b64 <<'EOF'
          
          EOF
          sed -i 's/^          //' /tmp/patch.b64
          base64 -d /tmp/patch.b64 | gunzip > /tmp/change.patch
          git apply /tmp/change.patch
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/epistemic_workbench_integration.rs
          git commit -m "WIP 02: grounding cycle diagnostics"
          git push origin HEAD:main
