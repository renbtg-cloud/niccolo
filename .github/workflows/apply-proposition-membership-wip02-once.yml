name: Apply proposition membership WIP 02 once

on:
  push:
    branches:
      - tmp/proposition-membership-wip02-20261120
    paths:
      - .github/workflows/apply-proposition-membership-wip02-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - run: |
          git fetch origin tmp/proposition-membership-wip02-20261120:tmp/proposition-membership-wip02-20261120
          git show tmp/proposition-membership-wip02-20261120:wip02-proposition-membership.patch > /tmp/wip02.patch
          git am /tmp/wip02.patch
          git push origin HEAD:main
