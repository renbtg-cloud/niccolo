name: Apply transitive reassessment WIP 01

on:
  push:
    branches:
      - 'tmp/apply-transitive-reassessment-wip01-20261121'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Verify expected head
        run: |
          test "$(git rev-parse HEAD)" = "95c58f982cb3c203fbbfa34ba9853904f9be5516"
      - name: Apply patch
        run: |
          cat > /tmp/patch.b64 <<'EOF'
          
          EOF
          sed -i 's/^          //' /tmp/patch.b64
          base64 -d /tmp/patch.b64 | gunzip > /tmp/change.patch
          git apply /tmp/change.patch
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/epistemic_workbench.rs frontend/src/pages/ExpertWorkbenchPage.jsx frontend/src/pages/ExpertWorkbench.product.test.js
          git commit -m "WIP 01: transitive selective reassessment"
          git push origin HEAD:main
