name: Publish deterministic MVP frontend bundle
on:
  push:
    branches:
      - feat/lazy-technical-routes-20261114
    paths:
      - 'frontend/src/App.jsx'
      - 'frontend/src/App.lazy.test.js'
      - 'src/api.rs'
      - 'scripts/build-mvp.sh'
      - '.github/workflows/publish-lazy-bundle.yml'

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build and verify frontend
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build
      - name: Preserve deterministic embedded assets for Rust compilation
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f frontend/dist/index.html frontend/dist/assets/app.js frontend/dist/assets/app.css
          git add -f frontend/dist/assets/chunks/*.js
          if git diff --cached --quiet; then
            echo 'No changes to the embedded frontend assets'
            exit 0
          fi
          git commit -m "DONE: Update embedded React assets for lazy technical routes"
          git push origin "HEAD:${GITHUB_REF_NAME}"
