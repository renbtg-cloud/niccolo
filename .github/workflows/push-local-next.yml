          test "$(git rev-parse HEAD^{tree})" = 0451dea6fcb017fe7dab309dccc359c94c1e963e
          git config user.name "ChatGPT autonomous worker"
          git config user.email "chatgpt-local@invalid"
          git am /tmp/965d441.mbox
          test "$(git rev-parse HEAD^{tree})" = 56434d80d5bae741f91a0434294bfa1110e36e33
          git push origin HEAD:refs/heads/ci/mvp-checkpoint
