name: Apply expert workbench WIP 01 once

on:
  push:
    branches:
      - tmp/apply-expert-workbench-20261120
    paths:
      - .github/workflows/apply-expert-workbench-wip01-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Apply WIP 01 patch
        env:
          PATCH_B64: [...truncated...]
        run: |
          printf '%s' "$PATCH_B64" | base64 -d | gunzip > /tmp/wip01.patch
          git am /tmp/wip01.patch
          git push origin HEAD:main
