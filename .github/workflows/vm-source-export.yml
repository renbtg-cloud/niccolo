name: VM source export
on:
  push:
    branches: [ci/vm-source-export]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Pack pinned current checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin 0ce7d4887c732ee719dd764eb938c4c74fadb6e5
          test "$(git rev-parse FETCH_HEAD)" = '0ce7d4887c732ee719dd764eb938c4c74fadb6e5'
          git archive --format=tar.gz --output=niccolo-vm-source.tar.gz FETCH_HEAD
          printf '%s\n' '0ce7d4887c732ee719dd764eb938c4c74fadb6e5' > niccolo-source-commit.txt
          sha256sum niccolo-vm-source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: niccolo-vm-source
          path: |
            niccolo-vm-source.tar.gz
            niccolo-source-commit.txt
          retention-days: 1
