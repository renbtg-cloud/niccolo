name: VM source export
on:
  push:
    branches: [ci/vm-source-export]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Pack pinned MVP development snapshot
        shell: bash
        run: |
          git fetch --no-tags --depth=1 origin 0abe17ae3dba2d335177b83608b82d2e0752ebad
          test "$(git rev-parse FETCH_HEAD)" = '0abe17ae3dba2d335177b83608b82d2e0752ebad'
          git archive --format=tar.gz --output=niccolo-vm-source.tar.gz FETCH_HEAD
          printf '%s\n' '0abe17ae3dba2d335177b83608b82d2e0752ebad' > niccolo-source-commit.txt
          sha256sum niccolo-vm-source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: niccolo-vm-source
          path: |
            niccolo-vm-source.tar.gz
            niccolo-source-commit.txt
          retention-days: 1
