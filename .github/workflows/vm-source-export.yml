name: Push local checkpoint commit
on:
  push:
    branches: [ci/vm-source-export]
permissions:
  contents: write
jobs:
  push-local:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply local 4058ac6 and push immediately
        shell: bash
        env:
          PATCH_B64: 
        run: |
          set -euo pipefail
          printf '%s' "$PATCH_B64" | base64 -d | gzip -d > /tmp/local.mbox
          git fetch origin ci/mvp-checkpoint
          git checkout -B push-local FETCH_HEAD
          test "$(git rev-parse HEAD^{tree})" = aa03acea6ad37e0a0e7514defb48baddb30ebda8
          git am /tmp/local.mbox
          test "$(git rev-parse HEAD^{tree})" = 0451dea6fcb017fe7dab309dccc359c94c1e963e
          git push origin HEAD:ci/mvp-checkpoint
