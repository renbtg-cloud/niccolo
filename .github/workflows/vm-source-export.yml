name: VM source export
on:
  push:
    branches: [ci/vm-source-export]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Pack pinned MVP checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin 694db9c3f0afc607c0ebe76cee82031d118789f3
          test "$(git rev-parse FETCH_HEAD)" = '694db9c3f0afc607c0ebe76cee82031d118789f3'
          git archive --format=tar.gz --output=niccolo-vm-source.tar.gz FETCH_HEAD
          printf '%s\n' '694db9c3f0afc607c0ebe76cee82031d118789f3' > niccolo-source-commit.txt
          sha256sum niccolo-vm-source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: niccolo-vm-source
          path: |
            niccolo-vm-source.tar.gz
            niccolo-source-commit.txt
          retention-days: 1
