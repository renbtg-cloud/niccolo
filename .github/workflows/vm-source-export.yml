name: VM source export
on:
  push:
    branches: [ci/vm-source-export]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Pack pinned MVP checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin d1b54d46d2f43dac93bcee31203b8b966d98f3d4
          test "$(git rev-parse FETCH_HEAD)" = 'd1b54d46d2f43dac93bcee31203b8b966d98f3d4'
          git archive --format=tar.gz --output=niccolo-vm-source.tar.gz FETCH_HEAD
          printf '%s\n' 'd1b54d46d2f43dac93bcee31203b8b966d98f3d4' > niccolo-source-commit.txt
          sha256sum niccolo-vm-source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: niccolo-vm-source
          path: |
            niccolo-vm-source.tar.gz
            niccolo-source-commit.txt
          retention-days: 1
