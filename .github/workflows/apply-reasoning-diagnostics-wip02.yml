name: Apply reasoning diagnostics WIP 02

on:
  push:
    branches:
      - 'tmp/apply-reasoning-diagnostics-wip02-20261121'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Verify expected head
        run: test "$(git rev-parse HEAD)" = "4494672da1fe700814e3eb2106c1f252d5a6acb6"
      - name: Apply patch
        run: |
          echo '' | base64 -d | gunzip > /tmp/change.patch
          git apply /tmp/change.patch
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/epistemic_workbench.rs tests/epistemic_workbench_integration.rs frontend/src/pages/ExpertWorkbenchPage.jsx frontend/src/pages/ExpertWorkbench.product.test.js
          git commit -m "WIP 02: explicit reasoning diagnostics"
          git push origin HEAD:main
