name: Temporary WhatsApp rustfmt
on:
  push:
    branches:
      - fix/whatsapp-export-variants-20261112
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install pinned rustfmt
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt
      - name: Format WhatsApp parser regression files
        shell: bash
        run: |
          set -euo pipefail
          rustfmt +1.99.1 --edition 2024 src/source_import.rs tests/source_ingestion_integration.rs
          if git diff --quiet -- src/source_import.rs tests/source_ingestion_integration.rs; then
            echo 'Already formatted.'
            exit 0
          fi
          git config user.name 'ChatGPT autonomous worker'
          git config user.email 'chatgpt-local@invalid'
          git add src/source_import.rs tests/source_ingestion_integration.rs
          git commit -m 'style(import): rustfmt WhatsApp variant parser tests'
          git push origin HEAD:fix/whatsapp-export-variants-20261112
