name: Temporary offline VM source export

on:
  push:
    branches:
      - ci/mvp-checkpoint

permissions:
  contents: read

jobs:
  export-source:
    if: ${{ contains(github.event.head_commit.message, '[vm-source-export]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pack exact source
        run: git archive --format=tar.gz --output=niccolo-source-${GITHUB_SHA}.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: niccolo-source-${{ github.sha }}
          path: niccolo-source-${{ github.sha }}.tar.gz
          retention-days: 1
