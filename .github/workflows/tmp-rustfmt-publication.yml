name: Temporary publication rustfmt

on:
  push:
    branches:
      - ci/mvp-checkpoint

permissions:
  contents: write

jobs:
  format:
    if: ${{ contains(github.event.head_commit.message, '[publication-rustfmt]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ci/mvp-checkpoint
      - name: Install pinned Rustfmt
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt
          rustup default 1.99.1
      - name: Format publication sources
        run: |
          rustfmt --edition 2024             src/api.rs             src/git_publication.rs             src/github_publisher.rs             src/presentation_package.rs             tests/git_publication_integration.rs
      - name: Commit formatting if needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name renbtg-cloud
          git config user.email renbtg@gmail.com
          git add src/api.rs src/git_publication.rs src/github_publisher.rs src/presentation_package.rs tests/git_publication_integration.rs
          git commit -m "Apply rustfmt to Git publication implementation"
          git push origin HEAD:ci/mvp-checkpoint
