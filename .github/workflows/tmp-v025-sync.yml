name: tmp v025 recover

on:
  push:
    branches: [tmp-v025-sync]
    paths:
      - '.sync/v025.recover'

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct staged archive
        shell: bash
        run: |
          set -euo pipefail
          cat .sync/v025.part00 .sync/v025.part01 .sync/v025.part02 .sync/v025.part03 .sync/v025.part04 .sync/v025.part05 .sync/v025.part06 .sync/v025.part07 | base64 -d > /tmp/v025-files.tar.gz
          sha256sum /tmp/v025-files.tar.gz
          gzip -t /tmp/v025-files.tar.gz
          mkdir -p /tmp/v025-recovered
          tar -xzf /tmp/v025-files.tar.gz -C /tmp/v025-recovered
          find /tmp/v025-recovered -type f -print | sort
      - uses: actions/upload-artifact@v4
        with:
          name: v025-recovered
          path: /tmp/v025-recovered
          if-no-files-found: error
