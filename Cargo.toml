[package]
name = "niccolo-evidence-poc"
version = "0.6.0"
edition = "2024"
license = "UNLICENSED"
description = "Offline epistemic-provenance proof of concept for Niccolò/Duhme"

[lib]
name = "niccolo_evidence"
path = "src/lib.rs"

[[bin]]
name = "niccolo-demo"
path = "src/main.rs"

[[bin]]
name = "niccolo-benchmark-demo"
path = "src/benchmark_demo.rs"

[[bin]]
name = "niccolo-evolution-demo"
path = "src/evolution_demo.rs"

[[bin]]
name = "niccolo-dag-evolution-demo"
path = "src/dag_evolution_demo.rs"

[dependencies]
# Keep the runtime thin; exact vendored releases are pinned in Cargo.lock.
sqlx = { version = "=0.8.6", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid"] }
tokio = { version = "=1.54.1", features = ["macros", "rt-multi-thread"] }
uuid = { version = "=1.29.0", features = ["v4"] }
thiserror = "2"
sha2 = "0.10"

[features]
pg-integration = []

[[bin]]
name = "niccolo-source-demo"
path = "src/source_demo.rs"
